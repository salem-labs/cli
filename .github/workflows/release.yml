name: Veröffentlichung

# Fertige Dateien für die drei Systeme, angehängt an eine
# Veröffentlichung.
#
# **Dieses Repository ist öffentlich, und das macht den Unterschied.**
# Bei einem privaten antwortet GitHub auf die Download-Adresse einer
# Datei mit 404, auch mit gültigem Zeichen, und nur der Weg über die
# Schnittstelle mit der Kennung des Anhangs funktioniert; die clikd-CLI
# musste sich deshalb ihren eigenen Installationsweg bauen. Hier reicht
# die Adresse, die in der Veröffentlichung steht.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      fassung:
        description: "Fassung, etwa 0.2.0"
        required: true
      # **Damit ein einzelner Fehlschlag nicht vier Bauten kostet.**
      # Genau der Fall am 15.09.2026: drei Plattformen hatten
      # veröffentlicht, Windows war an einem fehlenden `zip`
      # gescheitert, und ohne diese Eingabe hätte man alle vier noch
      # einmal bezahlt, um eine Datei nachzuliefern.
      nur:
        description: "Nur diese eine Plattform"
        required: false
        type: choice
        default: "alle"
        options:
          - "alle"
          - "macOS (Apple Silicon)"
          - "macOS (Intel)"
          - "Linux"
          - "Windows"

permissions:
  contents: write

jobs:
  # Welche Plattformen gebaut werden, entscheidet ein eigener Auftrag.
  #
  # Ein `if` am Bauauftrag ginge nicht: dort kennt GitHub `github`,
  # `needs`, `vars` und `inputs`, aber **nicht** `matrix`, und sagt das
  # erst beim Anstoßen. Ein Auftrag, der gar nicht erst entsteht, kostet
  # nichts; macOS-Läufer werden zehnfach abgerechnet.
  auswahl:
    runs-on: ubuntu-latest
    outputs:
      plattformen: ${{ steps.filtern.outputs.plattformen }}
    steps:
      - id: filtern
        shell: bash
        env:
          NUR: ${{ github.event.inputs.nur }}
        run: |
          ALLE='[
            {"os":"macos-latest","ziel":"aarch64-apple-darwin","name":"macOS (Apple Silicon)"},
            {"os":"macos-latest","ziel":"x86_64-apple-darwin","name":"macOS (Intel)"},
            {"os":"ubuntu-latest","ziel":"x86_64-unknown-linux-gnu","name":"Linux"},
            {"os":"windows-latest","ziel":"x86_64-pc-windows-msvc","name":"Windows"}
          ]'
          if [ -z "${NUR:-}" ] || [ "$NUR" = "alle" ]; then
            AUSWAHL="$(echo "$ALLE" | jq -c .)"
          else
            AUSWAHL="$(echo "$ALLE" | jq -c --arg n "$NUR" '[.[] | select(.name == $n)]')"
            if [ "$(echo "$AUSWAHL" | jq length)" = "0" ]; then
              echo "»$NUR« ist keine der vier Plattformen." >&2
              exit 1
            fi
          fi
          echo "plattformen=$AUSWAHL" >> "$GITHUB_OUTPUT"
          echo "Gebaut wird: $(echo "$AUSWAHL" | jq -r '[.[].name] | join(", ")')"

  bauen:
    needs: auswahl
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.auswahl.outputs.plattformen) }}

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v5

      # **`shell: bash` ist hier kein Geschmack.** Ohne die Zeile nimmt
      # der Windows-Läufer PowerShell, und ein Zuschnitt wie
      # `${ETIKETT#v}` ist dort ein Syntaxfehler statt einer Zuweisung.
      # Genau daran ist am 14.09.2026 der erste Veröffentlichungslauf
      # von Rakete gescheitert, und zwar nur auf Windows.
      - name: Etikett und Fassung stimmen überein
        shell: bash
        run: |
          ETIKETT="${{ github.event.inputs.fassung && format('v{0}', github.event.inputs.fassung) || github.ref_name }}"
          ETIKETT="${ETIKETT#v}"
          KONFIG=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$ETIKETT" != "$KONFIG" ]; then
            echo "Das Etikett sagt $ETIKETT, Cargo.toml sagt $KONFIG."
            exit 1
          fi
          echo "Beide sagen $KONFIG"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.ziel }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.ziel }}

      - name: Systembibliotheken (nur Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Bauen
        run: cargo build --release --target ${{ matrix.ziel }} -p rakete-cli

      # Ein Archivformat für alle vier, damit der Auspacker auf jeder
      # Seite derselbe sein kann.
      - name: Einpacken
        shell: bash
        run: |
          NAME="rakete-${{ matrix.ziel }}"
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.ziel }}/release/rakete.exe" "dist/"
          else
            cp "target/${{ matrix.ziel }}/release/rakete" "dist/"
          fi
          cp README.md LICENSE dist/
          tar -czf "$NAME.tar.gz" -C dist .
          shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256" 2>/dev/null \
            || sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"

      # **Das Bundle für Claude Desktop, je Plattform eins.**
      #
      # Ein .mcpb ist ein Zip mit einer manifest.json und dem Server
      # darin, wie eine Chrome-Erweiterung. `server.type: binary` heißt,
      # dass genau dieses Binär hineingeht: kein Node, kein Python
      # daneben. Der Kunde lädt eine Datei, klickt einmal und tippt sein
      # Zeichen in ein maskiertes Feld.
      #
      # **Gebaut in Python und nicht in der Shell.** Der erste Lauf ist
      # hier auf Windows an `zip: command not found` gescheitert: das
      # Git-bash eines Windows-Läufers bringt kein zip mit. Python ist
      # auf allen vier Läufern da und tut überall dasselbe.
      - name: Bundle für Claude Desktop
        shell: bash
        run: |
          FASSUNG=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          BUNDLE="rakete-${{ matrix.ziel }}.mcpb"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            BINAER="target/${{ matrix.ziel }}/release/rakete.exe"
          else
            BINAER="target/${{ matrix.ziel }}/release/rakete"
          fi
          python3 scripts/bundle.py "$FASSUNG" "$BINAER" "$BUNDLE"
          shasum -a 256 "$BUNDLE" > "$BUNDLE.sha256" 2>/dev/null \
            || sha256sum "$BUNDLE" > "$BUNDLE.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.fassung && format('v{0}', github.event.inputs.fassung) || github.ref_name }}
          files: |
            rakete-${{ matrix.ziel }}.tar.gz
            rakete-${{ matrix.ziel }}.tar.gz.sha256
            rakete-${{ matrix.ziel }}.mcpb
            rakete-${{ matrix.ziel }}.mcpb.sha256
          body: |
            `rakete` für ${{ matrix.name }} und die übrigen Systeme.

            Auspacken, irgendwohin in den PATH legen, dann:

            ```
            rakete login --server https://app.rakete.systems
            ```

            Für ein Programm oder eine KI: ein Zeichen in Rakete anlegen
            (Einstellungen, Zugang) und `RAKETE_SERVER` und
            `RAKETE_TOKEN` setzen. `rakete describe` sagt dann alles
            Weitere.

            **Für Claude Desktop** die `.mcpb`-Datei der eigenen
            Plattform herunterladen und öffnen. **Für Claude Code**:

            ```
            /plugin marketplace add l3pus-labs/cli
            /plugin install rakete@l3pus
            ```
